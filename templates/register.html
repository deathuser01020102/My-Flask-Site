<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TestSecurity Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; text-align: center; }
        label { display: block; margin-top: 15px; color: #94a3b8; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
        button { margin-top: 20px; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
        .error { color: #ef4444; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #38bdf8; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Register</h2>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Choose a password" required>

            <button type="submit">Register</button>
        </form>
        
        <div class="links">
            <p>Already have an account? <a href="/login">Login</a></p>
            <p><a href="/">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>

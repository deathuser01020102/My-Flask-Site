<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Profil Ayarları - TestSecurity Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; }
        .navbar { background-color: #1e293b; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 20px; font-weight: bold; color: #38bdf8; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .nav-links a:hover { color: #38bdf8; }
        .main-container { padding: 40px; max-width: 600px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 15px; color: #94a3b8; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
        button { margin-top: 20px; background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
        .success { color: #22c55e; font-size: 14px; margin-bottom: 15px; }
        .error { color: #ef4444; font-size: 14px; margin-bottom: 15px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🛡️ TestSecurity Lab</div>
        <div class="nav-links">
            <a href="/dashboard">Panel</a>
            <a href="/logout" style="color: #ef4444;">Çıxış Et</a>
        </div>
    </div>
    <div class="main-container">
        <a href="/dashboard" class="back-link">← Geri qayıt</a>
        <div class="card">
            <h2>⚙️ Profil Ayarları</h2>
            
            {% if success %}
                <p class="success">{{ success }}</p>
            {% endif %}
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <label>İstifadəçi Adı:</label>
                <input type="text" name="username" value="{{ username }}" required>

                <label>Yeni Şifrə (dəyişmək istəmirsinizsə boş buraxın):</label>
                <input type="password" name="new_password" placeholder="Yeni şifrə">

                <label>Cari Şifrə (təsdiqləmək üçün vacibdir):</label>
                <input type="password" name="old_password" placeholder="Cari şifrənizi daxil edin" required>

                <button type="submit">Yenilə</button>
            </form>
        </div>
    </div>
</body>
</html>
